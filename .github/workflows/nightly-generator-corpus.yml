name: MoonSmith Nightly Generator Corpus

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moonsmith-nightly-generator-corpus
  cancel-in-progress: false

jobs:
  nightly-generator-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install PowerShell
        run: |
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Show toolchain version
        run: moon version --all

      - name: Run the fixed 1,000-seed corpus
        shell: pwsh
        run: |
          $summary = ./scripts/run_batch.ps1 -SeedStart 14990 -Count 1000 `
            -Depth 4 -Targets @('js','wasm','wasm-gc') -TimeoutSeconds 30 |
            ConvertFrom-Json
          ./scripts/validate_nightly_summary.ps1 -Summary $summary | ConvertTo-Json -Compress | Write-Output
          $batchFile = Get-ChildItem -LiteralPath '.moonsmith/runs' -Filter 'batch_*.json' -File |
            Sort-Object -Property LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $batchFile) { throw 'The batch runner did not preserve its JSON report.' }
          $htmlReport = ./scripts/moonsmith.ps1 batch-report -BatchPath $batchFile.FullName -Force |
            ConvertFrom-Json
          if ($htmlReport.count -ne 1000 -or
              -not (Test-Path -LiteralPath $htmlReport.htmlReportPath -PathType Leaf)) {
            throw 'The nightly HTML report does not match the verified 1,000-case batch.'
          }
          $htmlReport | ConvertTo-Json -Compress | Write-Output

      - name: Preserve the nightly corpus report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: moonsmith-nightly-generator-corpus-${{ github.run_id }}
          path: |
            .moonsmith/runs/batch_*.json
            .moonsmith/runs/batch_*.html
          if-no-files-found: warn
          retention-days: 30
