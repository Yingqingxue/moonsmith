name: MoonSmith CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      extended_scan:
        description: Run the bounded current-generator seed scan (depths 4, 6, and 8)
        required: false
        type: boolean
        default: false
      extended_windows_crosscheck:
        description: Run Windows native-release for matching seeds; enable extended_scan too for automatic comparison
        required: false
        type: boolean
        default: false
      scan_start:
        description: Linux scan start (>=13990); Windows cross-check may use completed Linux ranges such as 13000, 13300, 13530, or 13760.
        required: false
        type: string
        default: '13990'
      scan_profile:
        description: Standard uses 230 seeds at depths 4, 6, and 8; depth10 uses a focused five-seed cohort.
        required: false
        type: choice
        options:
          - standard
          - depth10
        default: standard
      gcc_fma_experiment:
        description: Run the opt-in GCC/FMA reproduction and contraction-disabled control
        required: false
        type: boolean
        default: false
      semantic_selection_replication:
        description: Run the preregistered source-size-matched semantic-selection replication
        required: false
        type: boolean
        default: false
      semantic_selection_seed_start:
        description: First candidate seed for a preregistered semantic-selection cohort
        required: false
        type: choice
        options:
          - '24220'
          - '24320'
        default: '24220'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain version
        run: moon version --all

      - name: Update Mooncakes registry index
        run: moon update

      - name: Check and test all supported backends
        run: |
          moon check --deny-warn
          moon test --target js --deny-warn
          moon test --target wasm --deny-warn
          moon test --target wasm-gc --deny-warn
          gcc --version
          moon test --target native --deny-warn
          pwsh -NoProfile -File scripts/test_issue_1322.ps1
          ulimit -s 8192
          ulimit -c 0
          pwsh -NoProfile -File scripts/test_issue_2228.ps1

      - name: Check historical MoonBit coverage ICE regression
        run: |
          moon test --target js --enable-coverage --deny-warn regressions/issue_1071_coverage_ice
          moon coverage analyze -p Yingqingxue/moonsmith/regressions/issue_1071_coverage_ice

      - name: Check historical MoonBit Wasm valtype regression
        run: |
          moon test --target js --deny-warn regressions/issue_1274_wasm_valtype_raise
          moon test --target wasm --deny-warn regressions/issue_1274_wasm_valtype_raise
          moon test --target wasm-gc --deny-warn regressions/issue_1274_wasm_valtype_raise

      - name: Check historical MoonBit JS link-core regression
        run: |
          moon -C regressions/issue_1133_js_link_core_trait_identity check --target js --deny-warn main
          moon -C regressions/issue_1133_js_link_core_trait_identity run --target js --deny-warn main

      - name: Check reference and reducer integration
        shell: pwsh
        run: |
          ./scripts/test_reference.ps1
          ./scripts/test_reducer.ps1
          ./scripts/test_cli.ps1
          ./scripts/test_batch_reports.ps1
          ./scripts/test_semantic_selection.ps1

      - name: Smoke-test generated programs
        shell: pwsh
        run: |
          ./scripts/verify_seed.ps1 -Seed 0 -Depth 4 -Targets @('js','wasm','wasm-gc') -NoPersist
          # Seed 4 at depth 4 contains a generated Choice-returning local function.
          ./scripts/verify_seed.ps1 -Seed 4 -Depth 4 -Targets @('js','wasm','wasm-gc') -NoPersist
          ./scripts/verify_seed.ps1 -Seed 4000 -Depth 7 -Targets @('wasm') -NoPersist
          ./scripts/verify_seed.ps1 -Seed 6000 -Depth 8 -Targets @('js','wasm','wasm-gc') -NoPersist
          ./scripts/verify_seed.ps1 -Seed 7000 -Depth 9 -Targets @('js','wasm','wasm-gc') -NoPersist
          ./scripts/verify_seed.ps1 -Seed 8000 -Depth 10 -Targets @('js','wasm','wasm-gc') -NoPersist
          # Native debug's known #1322 signature is checked explicitly above.
          ./scripts/run_batch.ps1 -SeedStart 0 -Count 10 -Depth 4 -Targets @('js','wasm','wasm-gc','native-release')

      - name: Preserve smoke-test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: moonsmith-smoke-report
          path: |
            .moonsmith/runs/
            .moonsmith/reduced/injected/
            .moonsmith/reduced/corpus/
            .moonsmith/reduction/
            .moonsmith/issue_1322.json
            .moonsmith/issue_2228.json
          if-no-files-found: ignore
          retention-days: 30

  casekit-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out MoonSmith
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonSmith dependencies
        run: moon update

      - name: Check out pinned CaseKit comparator
        uses: actions/checkout@v5
        with:
          repository: kaigeliang/moonbit-casekit
          ref: cd1a4a12347b781706a25964a428a4a2fdf21996
          path: casekit-upstream

      - name: Build CaseKit native comparator
        working-directory: casekit-upstream
        run: |
          moon update
          moon build --target native
          echo "CASEKIT_CLI=$PWD/_build/native/debug/build/cli/cli.exe" >> "$GITHUB_ENV"

      - name: Cross-check MoonSmith observations with CaseKit
        shell: pwsh
        run: ./scripts/test_casekit_interop.ps1 -CaseKitCliPath "$env:CASEKIT_CLI"

      - name: Preserve CaseKit interoperability evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: casekit-interop-report
          path: .moonsmith/casekit-interop/
          if-no-files-found: ignore
          retention-days: 30

  windows-native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

      - name: Install MoonBit
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          Add-Content -LiteralPath $env:GITHUB_PATH -Value "$env:USERPROFILE\.moon\bin"

      - name: Show toolchain and native compiler
        shell: pwsh
        run: |
          moon version --all
          $compiler = Get-Command cl -ErrorAction Stop
          $compiler.Source
          (Get-Item -LiteralPath $compiler.Source).VersionInfo | Format-List FileVersion,ProductVersion

      - name: Update Mooncakes registry index
        shell: pwsh
        run: moon update

      - name: Check and test native backend
        shell: pwsh
        run: |
          moon check --deny-warn
          moon test --target native --deny-warn
          pwsh -NoProfile -File scripts/test_issue_1322.ps1

      - name: Smoke-test Windows native generated programs
        shell: pwsh
        run: |
          # Native debug is separately exercised by the dedicated #1322
          # regression; generated valtype-array probes intentionally reproduce
          # its known ICE, so broad differential batches use native release.
          # Seed 4 at depth 4 contains a generated Choice-returning local function.
          ./scripts/verify_seed.ps1 -Seed 4 -Depth 4 -Targets @('native-release') -NoPersist
          ./scripts/run_batch.ps1 -SeedStart 9000 -Count 100 -Depth 6 -Targets @('native-release') -TimeoutSeconds 60
          ./scripts/run_batch.ps1 -SeedStart 9200 -Count 30 -Depth 8 -Targets @('native-release') -TimeoutSeconds 60

      - name: Check reference, reducer, and CLI integration
        shell: pwsh
        run: |
          ./scripts/test_reference.ps1
          ./scripts/test_reducer.ps1
          ./scripts/test_cli.ps1

      - name: Preserve Windows native smoke report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: moonsmith-windows-native-report
          path: |
            .moonsmith/runs/
            .moonsmith/reduced/injected/
            .moonsmith/reduced/corpus/
            .moonsmith/reduction/
            .moonsmith/issue_1322.json
          if-no-files-found: ignore
          retention-days: 30

  gcc-fma-experiment:
    if: github.event_name == 'workflow_dispatch' && inputs.gcc_fma_experiment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update Mooncakes registry index
        run: moon update

      - name: Record toolchain and FMA capability
        run: |
          moon version --all
          gcc --version
          grep -m1 -Eo '(^| )fma( |$)' /proc/cpuinfo

      - name: Compare GCC FMA contraction with the controls
        run: bash scripts/test_gcc_fma_experiment.sh

  extended-seed-scan:
    if: github.event_name == 'workflow_dispatch' && inputs.extended_scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update Mooncakes registry index
        run: moon update

      - name: Install PowerShell
        run: |
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Show toolchain version
        run: moon version --all

      - name: Scan current generator on fixed seed ranges
        shell: pwsh
        env:
          SCAN_START: ${{ inputs.scan_start }}
          SCAN_PROFILE: ${{ inputs.scan_profile }}
        run: |
          $seedStart = 0
          if ($env:SCAN_START -notmatch '^\d+$' -or
              -not [int]::TryParse($env:SCAN_START, [ref]$seedStart)) {
            throw 'scan_start must be a non-negative 32-bit integer.'
          }
          if ($seedStart -lt 13990 -or ([long]$seedStart + 229) -gt [int]::MaxValue) {
            throw 'scan_start must be >= 13990 to avoid the documented samples and leave room for 230 32-bit seeds.'
          }
          if ($env:SCAN_PROFILE -eq 'depth10') {
            ./scripts/run_batch.ps1 -SeedStart $seedStart -Count 5 -Depth 10 -Targets @('js','wasm','wasm-gc') -TimeoutSeconds 60
          } elseif ($env:SCAN_PROFILE -eq 'standard') {
            ./scripts/run_batch.ps1 -SeedStart $seedStart -Count 100 -Depth 4 -Targets @('js','wasm','wasm-gc') -TimeoutSeconds 30
            ./scripts/run_batch.ps1 -SeedStart ($seedStart + 100) -Count 100 -Depth 6 -Targets @('js','wasm','wasm-gc') -TimeoutSeconds 30
            ./scripts/run_batch.ps1 -SeedStart ($seedStart + 200) -Count 30 -Depth 8 -Targets @('js','wasm','wasm-gc') -TimeoutSeconds 30
          } else {
            throw "Unknown scan profile '$($env:SCAN_PROFILE)'."
          }

      - name: Preserve extended scan reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: moonsmith-current-generator-seed-scan
          path: .moonsmith/runs/batch_*.json
          if-no-files-found: error
          retention-days: 30

  extended-windows-crosscheck:
    if: github.event_name == 'workflow_dispatch' && inputs.extended_windows_crosscheck
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

      - name: Install MoonBit
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          Add-Content -LiteralPath $env:GITHUB_PATH -Value "$env:USERPROFILE\.moon\bin"

      - name: Update Mooncakes registry index
        shell: pwsh
        run: moon update

      - name: Show toolchain and native compiler
        shell: pwsh
        run: |
          moon version --all
          $compiler = Get-Command cl -ErrorAction Stop
          $compiler.Source
          (Get-Item -LiteralPath $compiler.Source).VersionInfo | Format-List FileVersion,ProductVersion

      - name: Cross-check the matching Windows native-release seeds
        shell: pwsh
        env:
          CROSSCHECK_START: ${{ inputs.scan_start }}
          CROSSCHECK_PROFILE: ${{ inputs.scan_profile }}
        run: |
          $seedStart = 0
          if ($env:CROSSCHECK_START -notmatch '^\d+$' -or
              -not [int]::TryParse($env:CROSSCHECK_START, [ref]$seedStart)) {
            throw 'The Windows cross-check start must be a non-negative 32-bit integer.'
          }
          if ($seedStart -lt 13000 -or ([long]$seedStart + 229) -gt [int]::MaxValue) {
            throw 'Choose the start of a completed Linux extended scan and leave room for 230 32-bit seeds.'
          }
          if ($env:CROSSCHECK_PROFILE -eq 'depth10') {
            ./scripts/run_batch.ps1 -SeedStart $seedStart -Count 5 -Depth 10 -Targets @('native-release') -TimeoutSeconds 120
          } elseif ($env:CROSSCHECK_PROFILE -eq 'standard') {
            ./scripts/run_batch.ps1 -SeedStart $seedStart -Count 100 -Depth 4 -Targets @('native-release') -TimeoutSeconds 60
            ./scripts/run_batch.ps1 -SeedStart ($seedStart + 100) -Count 100 -Depth 6 -Targets @('native-release') -TimeoutSeconds 60
            ./scripts/run_batch.ps1 -SeedStart ($seedStart + 200) -Count 30 -Depth 8 -Targets @('native-release') -TimeoutSeconds 60
          } else {
            throw "Unknown cross-check profile '$($env:CROSSCHECK_PROFILE)'."
          }

      - name: Preserve Windows cross-check reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: moonsmith-windows-current-generator-crosscheck
          path: .moonsmith/runs/batch_*.json
          if-no-files-found: error
          retention-days: 30

  semantic-selection-replication:
    if: github.event_name == 'workflow_dispatch' && inputs.semantic_selection_replication
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update Mooncakes registry index
        run: moon update

      - name: Install PowerShell
        run: |
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Record experiment toolchain
        run: moon version --all

      - name: Run the preregistered fixed cohort
        shell: pwsh
        env:
          SEMANTIC_SELECTION_SEED_START: ${{ inputs.semantic_selection_seed_start }}
        run: |
          $seedStart = [int]$env:SEMANTIC_SELECTION_SEED_START
          ./scripts/compare_semantic_selection.ps1 `
            -SeedStart $seedStart -CandidateCount 100 -ExecutionBudget 20 -Depth 4 `
            -Targets @('js','wasm','wasm-gc') -SizeMatched `
            -OutputPath ".moonsmith/runs/selection_${seedStart}_100_20_d4_size_matched.json"

      - name: Compare MoonGrammata feedback on the identical frozen candidate pool
        shell: pwsh
        env:
          SEMANTIC_SELECTION_SEED_START: ${{ inputs.semantic_selection_seed_start }}
        run: |
          $seedStart = [int]$env:SEMANTIC_SELECTION_SEED_START
          $inputReport = ".moonsmith/runs/selection_${seedStart}_100_20_d4_size_matched.json"
          $outputReport = ".moonsmith/runs/moongrammata_selection_${seedStart}_100_20.json"
          ./scripts/run_moongrammata_selection.ps1 `
            -InputReport $inputReport -ExecutionBudget 20 -Seed 20261018 `
            -OutputPath $outputReport
          ./scripts/test_moongrammata_selection.ps1 `
            -InputReport $inputReport -ExecutionBudget 20 -Seed 20261018

      - name: Preserve semantic-selection report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: moonsmith-semantic-selection-replication
          path: |
            .moonsmith/runs/selection_*_100_20_d4_size_matched.json
            .moonsmith/runs/moongrammata_selection_*_100_20.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  compare-current-generator-reports:
    if: github.event_name == 'workflow_dispatch' && inputs.extended_scan && inputs.extended_windows_crosscheck
    needs:
      - extended-seed-scan
      - extended-windows-crosscheck
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Download Linux reports
        uses: actions/download-artifact@v8
        with:
          name: moonsmith-current-generator-seed-scan
          path: .moonsmith/crosscheck/linux

      - name: Download Windows reports
        uses: actions/download-artifact@v8
        with:
          name: moonsmith-windows-current-generator-crosscheck
          path: .moonsmith/crosscheck/windows

      - name: Require matching seeds, source hashes, and outcomes
        shell: pwsh
        run: |
          ./scripts/compare_batch_reports.ps1 `
            -LinuxReportDirectory .moonsmith/crosscheck/linux `
            -WindowsReportDirectory .moonsmith/crosscheck/windows `
            -OutputPath .moonsmith/crosscheck/summary.json

      - name: Preserve cross-platform comparison summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: moonsmith-cross-platform-seed-comparison
          path: .moonsmith/crosscheck/summary.json
          if-no-files-found: ignore
          retention-days: 30
